<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | ParkVision</title><link rel="stylesheet" href="/static/auth.css"><main class="auth-card"><a href="/">◈ ParkVision</a><h1>Create your account</h1><p>We'll email you a six-digit verification code.</p><form id="form"><label>Full name</label><input id="name" required maxlength="100" autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password (10+ characters)</label><input id="password" type="password" required minlength="10" autocomplete="new-password"><button id="submit">Send verification code</button></form><p id="notice" role="status"></p><p>Already registered? <a href="/login">Sign in</a></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();document.getElementById("submit").disabled=true;document.getElementById('notice').textContent='Sending email…';try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value})});const d=await r.json();if(r.ok)location.href='/verify?email='+encodeURIComponent(document.getElementById("email").value);else document.getElementById('notice').textContent=d.error||'Signup failed'}catch(e){document.getElementById('notice').textContent='Connection error'}finally{document.getElementById("submit").disabled=false}}</script></html>
