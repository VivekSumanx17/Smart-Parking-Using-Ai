<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email | ParkVision</title><link rel="stylesheet" href="/static/auth.css"><main class="auth-card"><a href="/">◈ ParkVision</a><h1>Verify your email</h1><p>Enter the code sent to your inbox. It expires in 10 minutes.</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Six-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button>Verify and continue</button></form><p id="notice" role="status"></p><p>Didn't receive it? <a href="/signup">Request a new code</a></p></main><script>document.getElementById("email").value=new URLSearchParams(location.search).get('email')||'';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById("email").value,code:document.getElementById("code").value})});const d=await r.json();if(r.ok)location.href='/';else document.getElementById('notice').textContent=d.error||'Verification failed'}</script></html>
